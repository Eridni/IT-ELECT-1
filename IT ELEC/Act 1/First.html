<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RESTARTE Registration</title>
  <style>
    body {
    font-family: Arial, sans-serif;
    background: black;
    background-size: cover;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 50px;
    color: white;
    }

    .logo {
      font-size: 48px;
      font-weight: bold;
      margin-bottom: 20px;
      background: linear-gradient(to right, white 50%, blue 50%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-fill-color: transparent;
    }

    .form-container {
      background: linear-gradient(to right, blue 50%, black 50%);
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 0 15px rgba(0, 81, 255, 0.5);
      width: 320px;
      color: white;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: white;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 4px;
      background-color: #333;
      color: white;
    }

    input::placeholder {
      color: #ccc;
    }

    input[type="submit"] {
      width: 100%;
      padding: 10px;
      background-color: #fff;
      color: blue;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    input[type="submit"]:hover {
      background-color: #f0f0f0;
    }
  </style>
</head>
<body>

  <div class="logo">RESTARTE</div>

  <div class="form-container">
    <h2>Register Here</h2>
    <form action="#" method="post">
      <input type="email" name="email" placeholder="Email" required>
      <input type="password" name="password" placeholder="Password" required>
      <input type="submit" value="Submit">
    </form>
  </div>

</body>
</html>
