<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RESTARTE Registration</title>
  <style>
    body {
    font-family: Arial, sans-serif;
    background: black;
    background-size: cover;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 50px;
    color: white;
    }

    .logo {
      font-size: 48px;
      font-weight: bold;
      margin-bottom: 20px;
      background: linear-gradient(to right, white 50%, blue 50%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .form-container {
      background: linear-gradient(to right, blue 50%, black 50%);
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 0 15px rgba(0, 81, 255, 0.5);
      width: 320px;
      color: white;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: white;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 4px;
      background-color: #333;
      color: white;
    }

    input::placeholder {
      color: #ccc;
    }

    input[type="submit"] {
      display: inline-block;
      width: 100%;
      padding: 10px;
      background-color: blue;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    input[type="submit"]:hover {
      background-color: red;
    }
  </style>
</head>
<body>

  <div class="logo">RESTARTE</div>

  <div class="form-container">
    <h2>Register Here</h2>

    <form action="display.php" method="post">
      <label for="fname">First name:</label><br>
      <input type="text" id="fname" name="fname" value="John"><br>
      <label for="lname">Last name:</label><br>
      <input type="text" id="lname" name="lname" value="Doe"><br>
      <label for="text">ID #</label><br>
      <input type="text" id="id" name="id" value="24209223"><br>
      <label for="text">Email</label><br>
      <input type="text" id="email" name="email" value="Oright@gmail.com"><br>
      <label for="text">Password</label><br>
      <input type="password" id="password" name="password" value="yepppie"><br><br>
      <input type="submit" value="Submit">
    </form>

  </div>
</body>
</html>
