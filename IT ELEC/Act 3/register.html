<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RESTARTE Registration</title>
  <style>
    body {
    font-family: Arial, sans-serif;
    background: black;
    background-size: cover;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 50px;
    color: white;
    }

    .logo {
      font-size: 48px;
      font-weight: bold;
      margin-bottom: 20px;
      background: linear-gradient(to right, white 50%, blue 50%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .form-container {
      background: linear-gradient(to right, blue 50%, black 50%);
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 0 15px rgba(0, 81, 255, 0.5);
      width: 320px;
      color: white;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: white;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 4px;
      background-color: #333;
      color: white;
    }

    input::placeholder {
      color: #ccc;
    }

    input[type="submit"] {
      display: inline-block;
      width: 100%;
      padding: 10px;
      background-color: blue;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    input[type="submit"]:hover {
      background-color: red;
    }
  </style>
</head>
<body>

  <div class="logo">RESTARTE</div>

  <div class="form-container">
    <h2>Register Here</h2>

    <form action="register.php" method="post" style="display: flex; flex-direction: column; gap: 10px;">
      <label for="fname">First name:</label>
      <input type="text" id="fname" name="fname" required>
      <label for="lname">Last name:</label>
      <input type="text" id="lname" name="lname" required>
      <label for="id">ID #</label>
      <input type="text" id="id" name="id" required>
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required>
      <label for="section">Section</label>
      <input type="text" id="section" name="section" required>
      <label for="course">Course</label>
      <input type="text" id="course" name="course" required>
      <input type="submit" value="Register">
    </form>
    <form action="register.php" method="post" style="margin-top:10px;">
      <input type="hidden" name="clear" value="1">
      <input type="submit" value="Clear All" style="background-color:red;">
    </form>

  </div>
</body>
</html>
